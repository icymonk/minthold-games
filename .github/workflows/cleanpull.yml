name: cleanpull

on:
  push:
    branches: [develop]
    paths:
      - games/cleanpull/**
      - .github/workflows/cleanpull.yml
      - .github/workflows/godot.yml

concurrency:
  group: cleanpull-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  game:
    uses: ./.github/workflows/godot.yml
    with:
      game: cleanpull
    secrets: inherit
