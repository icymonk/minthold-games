name: envelope

on:
  push:
    branches: [develop]
    paths:
      - games/envelope/**
      - .github/workflows/envelope.yml
      - .github/workflows/godot.yml

concurrency:
  group: envelope-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  game:
    uses: ./.github/workflows/godot.yml
    with:
      game: envelope
    secrets: inherit
