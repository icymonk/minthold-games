name: desk

on:
  push:
    branches: [develop]
    paths:
      - games/desk/**
      - .github/workflows/desk.yml
      - .github/workflows/godot.yml

concurrency:
  group: desk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  game:
    uses: ./.github/workflows/godot.yml
    with:
      game: desk
    secrets: inherit
