name: rooster

on:
  push:
    branches: [develop]
    paths:
      - games/rooster/**
      - .github/workflows/rooster.yml
      - .github/workflows/godot.yml

concurrency:
  group: rooster-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  game:
    uses: ./.github/workflows/godot.yml
    with:
      game: rooster
    secrets: inherit
