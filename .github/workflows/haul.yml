name: haul

on:
  pull_request:
    paths:
      - games/haul/**
      - .github/workflows/haul.yml
      - .github/workflows/godot.yml
  push:
    branches: [develop]
    paths:
      - games/haul/**
      - .github/workflows/haul.yml
      - .github/workflows/godot.yml

concurrency:
  group: haul-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  game:
    uses: ./.github/workflows/godot.yml
    with:
      game: haul
    secrets: inherit
