name: nightmart

on:
  push:
    branches: [develop]
    paths:
      - games/nightmart/**
      - .github/workflows/nightmart.yml
      - .github/workflows/godot.yml

concurrency:
  group: nightmart-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  game:
    uses: ./.github/workflows/godot.yml
    with:
      game: nightmart
    secrets: inherit
