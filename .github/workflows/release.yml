# 맥·윈도우 실행 파일을 만들어 GitHub Release에 올린다. 수동 실행만(Actions → release → Run workflow).
# 버전마다 올리는 `<game>-v<버전>-r<실행 번호>`와, 미리보기 모음 페이지가 가리키는 `<game>-latest`를 함께 만든다.
name: release

on:
  workflow_dispatch:
    inputs:
      game:
        description: games/ 아래 코드명
        required: true
        default: grove
        type: string

concurrency:
  group: release-${{ inputs.game }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.7.2
    defaults:
      run:
        working-directory: games/${{ inputs.game }}
    steps:
      - uses: actions/checkout@v4
      - name: Export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          ln -sfn /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Import
        run: godot --headless --import
      - name: Export macOS
        run: |
          mkdir -p build/release
          godot --headless --export-release "macOS" build/release/${{ inputs.game }}-macos.zip
          test -f build/release/${{ inputs.game }}-macos.zip
      - name: Export Windows
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/${{ inputs.game }}.exe
          test -f build/windows/${{ inputs.game }}.exe
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.game }}
          path: |
            games/${{ inputs.game }}/build/release
            games/${{ inputs.game }}/build/windows
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      GAME: ${{ inputs.game }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ inputs.game }}
          path: out
      - name: Zip
        run: |
          mkdir -p dist
          cp out/release/$GAME-macos.zip dist/
          (cd out/windows && zip -9 -r ../../dist/$GAME-windows.zip .)
          ls -la dist
      - name: Notes
        run: |
          VER=$(python3 -c "import sys; sys.path.insert(0, 'hub'); import build; print(build.version(build.plan_items('$GAME')))")
          TITLE=$(python3 -c "import json; m = json.load(open('games/$GAME/game.json')); print(m['title'] + ' ' + m['title_en'])")
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "TITLE=$TITLE" >> "$GITHUB_ENV"
          cat > notes.md <<NOTES
          $TITLE v$VER (커밋 ${GITHUB_SHA::7})

          - **맥:** \`$GAME-macos.zip\`을 받아 풀고 앱을 실행하세요. 서명하지 않은 앱이라 처음에는 앱을 오른쪽 클릭 → 열기 → 열기를 눌러야 해요. 「손상되었다」고 나오면 터미널에서 \`xattr -cr <앱 경로>\`를 한 번 실행하세요.
          - **윈도우:** \`$GAME-windows.zip\`을 받아 풀고 \`$GAME.exe\`를 실행하세요. 「PC 보호」 창이 뜨면 추가 정보 → 실행을 누르세요.
          NOTES
      - name: Release
        run: |
          TAG="$GAME-v$VER-r$GITHUB_RUN_NUMBER"
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TITLE v$VER (r$GITHUB_RUN_NUMBER)" --notes-file notes.md --latest=false
          gh release delete "$GAME-latest" --cleanup-tag --yes || true
          gh release create "$GAME-latest" dist/* --target "$GITHUB_SHA" --title "$TITLE 최신 (v$VER, r$GITHUB_RUN_NUMBER)" --notes-file notes.md --latest=false
