# 게임 하나를 테스트·웹 빌드·배포하는 공용 워크플로. 게임별 워크플로에서 호출한다.
name: godot

on:
  workflow_call:
    inputs:
      game:
        description: games/ 아래 코드명
        required: true
        type: string
      godot_version:
        required: false
        type: string
        default: 4.7.2
      macos:
        description: develop 머지 때 macOS .app(zip)도 만든다
        required: false
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:${{ inputs.godot_version }}
    defaults:
      run:
        working-directory: games/${{ inputs.game }}
    steps:
      - uses: actions/checkout@v4
      - name: Import
        run: godot --headless --import
      - name: gdUnit4
        run: GODOT_BIN=$(which godot) bash addons/gdUnit4/runtest.sh --headless -a res://tests --ignoreHeadlessMode

  # 결과물 업로드(Actions 저장 공간)를 쓰지 않도록 빌드한 그 작업에서 바로 배포한다.
  web:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:${{ inputs.godot_version }}
    env:
      HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
      CAN_DEPLOY: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    defaults:
      run:
        working-directory: games/${{ inputs.game }}
    steps:
      - uses: actions/checkout@v4
      - name: Export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          ln -sfn /root/.local/share/godot/export_templates/${{ inputs.godot_version }}.stable ~/.local/share/godot/export_templates/${{ inputs.godot_version }}.stable
      - name: Import
        run: godot --headless --import
      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.pck
      - name: Secret missing
        if: env.CAN_DEPLOY == 'true' && env.HAS_SA != 'true'
        run: echo "::warning::FIREBASE_SERVICE_ACCOUNT 없음 — 배포를 건너뜁니다."
      - uses: actions/setup-node@v4
        if: env.CAN_DEPLOY == 'true' && env.HAS_SA == 'true'
        with:
          node-version: 20
      - name: Ensure Hosting site
        if: env.CAN_DEPLOY == 'true' && env.HAS_SA == 'true'
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SITE: minthold-${{ inputs.game }}
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          printf '%s' "$SA_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx -y firebase-tools@15 hosting:sites:get "$SITE" --project minthold-preview \
            || npx -y firebase-tools@15 hosting:sites:create "$SITE" --project minthold-preview \
            || npx -y firebase-tools@15 hosting:sites:get "$SITE" --project minthold-preview
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
      - name: Deploy PR preview
        if: env.CAN_DEPLOY == 'true' && env.HAS_SA == 'true' && github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: minthold-preview
          entryPoint: games/${{ inputs.game }}
          target: web
          expires: 3d
      - name: Deploy live (develop)
        if: env.CAN_DEPLOY == 'true' && env.HAS_SA == 'true' && github.event_name == 'push'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: minthold-preview
          entryPoint: games/${{ inputs.game }}
          target: web
          channelId: live

  # 맥북 셀프 호스티드 러너(라벨 minthold-mac)에서 만들고 ~/MintholdBuilds/<게임>/ 에 바로 둔다.
  # 비공개 저장소라도 PR 코드는 맥북에서 돌리지 않는다(develop 머지·수동 실행만).
  macos:
    if: inputs.macos && github.event_name != 'pull_request'
    runs-on: [self-hosted, macOS, minthold-mac]
    timeout-minutes: 30
    env:
      GODOT: /Applications/Godot.app/Contents/MacOS/Godot
    defaults:
      run:
        working-directory: games/${{ inputs.game }}
    steps:
      - uses: actions/checkout@v4
      - name: Godot version
        run: |
          "$GODOT" --version | grep -q "^${{ inputs.godot_version }}\.stable" \
            || { echo "::error::맥북 Godot이 ${{ inputs.godot_version }}이 아닙니다: $("$GODOT" --version)"; exit 1; }
      - name: Import
        run: '"$GODOT" --headless --import'
      - name: gdUnit4
        run: GODOT_BIN="$GODOT" bash addons/gdUnit4/runtest.sh --headless -a res://tests --ignoreHeadlessMode
      - name: Export macOS
        run: |
          mkdir -p build/macos
          "$GODOT" --headless --export-release "macOS" build/macos/${{ inputs.game }}-macos.zip
          test -f build/macos/${{ inputs.game }}-macos.zip
      - name: Save to ~/MintholdBuilds
        run: |
          DEST="$HOME/MintholdBuilds/${{ inputs.game }}"
          mkdir -p "$DEST"
          find "$DEST" -maxdepth 1 -name '*.app' -exec rm -rf {} +
          ditto -x -k build/macos/${{ inputs.game }}-macos.zip "$DEST"
          cp build/macos/${{ inputs.game }}-macos.zip "$DEST/"
          echo "${GITHUB_SHA::7} $(date '+%Y-%m-%d %H:%M')" > "$DEST/BUILD.txt"
          ls "$DEST"
          echo "### 맥 앱: \`$DEST\` ($(cat "$DEST/BUILD.txt"))" >> "$GITHUB_STEP_SUMMARY"
