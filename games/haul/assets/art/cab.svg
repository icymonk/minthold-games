<svg xmlns="http://www.w3.org/2000/svg" width="320" height="400" viewBox="0 0 320 400">
  <!-- truck faces left; right edge meets cargo bay -->
  <path d="M320 20 L150 20 Q120 20 104 46 L46 160 Q36 180 36 200 L36 340 Q36 360 56 360 L320 360 Z" fill="#E8D9B5"/>
  <path d="M320 20 L150 20 Q120 20 104 46 L46 160 Q36 180 36 200 L36 340 Q36 360 56 360 L320 360 Z" fill="none" stroke="#0F1520" stroke-width="8"/>
  <!-- window -->
  <path d="M250 44 L156 44 Q138 44 128 62 L80 160 L250 160 Z" fill="#7CC6E8"/>
  <path d="M250 44 L156 44 Q138 44 128 62 L80 160 L250 160 Z" fill="none" stroke="#0F1520" stroke-width="6"/>
  <path d="M150 60 L110 140" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="10" stroke-linecap="round"/>
  <!-- stripe -->
  <rect x="36" y="230" width="284" height="34" fill="#F2A541"/>
  <!-- door line & handle -->
  <path d="M262 44 L262 330" stroke="#0F1520" stroke-width="5" stroke-opacity="0.45"/>
  <rect x="226" y="200" width="26" height="10" rx="5" fill="#0F1520"/>
  <!-- headlight & bumper -->
  <rect x="26" y="292" width="22" height="34" rx="6" fill="#FFE7A8" stroke="#0F1520" stroke-width="5"/>
  <rect x="18" y="340" width="120" height="26" rx="8" fill="#3A4560" stroke="#0F1520" stroke-width="6"/>
  <!-- mirror -->
  <rect x="62" y="96" width="14" height="44" rx="5" fill="#3A4560" stroke="#0F1520" stroke-width="4"/>
  <!-- chassis under cab -->
  <rect x="120" y="356" width="200" height="22" fill="#0F1520"/>
</svg>
